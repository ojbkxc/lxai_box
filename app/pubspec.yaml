name: lxai_box
description: 蓝星 AI 机器人——跨平台极客量化工具箱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 网络
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # 本地数据库
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.3
  path: ^1.9.1
  path_provider: ^2.1.5

  # 语音
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
