name: Build APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --org com.lanxing --project-name lxai_box --platforms android .

      - name: Verify generated files
        working-directory: app
        run: |
          echo "--- Checking build.gradle ---"
          ls -la android/app/build.gradle || echo "NOT FOUND"
          echo "--- Checking AndroidManifest.xml ---"
          ls -la android/app/src/main/AndroidManifest.xml || echo "NOT FOUND"

      - name: Patch Android project
        working-directory: app
        run: |
          # Add Shizuku dependency to build.gradle
          sed -i '/^flutter {/i \
          dependencies {\
              implementation '\''dev.rikka.shizuku:api:13.1.5'\''\
          }' android/app/build.gradle

          # Add permissions to AndroidManifest
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Restore custom Kotlin source files
        run: |
          git checkout HEAD -- app/android/app/src/main/kotlin/

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generation
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lxai-box-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
